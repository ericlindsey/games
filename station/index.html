<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ring Station</title>
  <link rel="stylesheet" href="css/style.css?v=0.2.2">
  <script type="importmap">{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "./src/main.js": "./src/main.js?v=0.2.2",
    "./src/params.js": "./src/params.js?v=0.2.2",
    "./src/physics.js": "./src/physics.js?v=0.2.2",
    "./src/station.js": "./src/station.js?v=0.2.2",
    "./src/stationShader.js": "./src/stationShader.js?v=0.2.2",
    "./src/sky.js": "./src/sky.js?v=0.2.2",
    "./src/controls.js": "./src/controls.js?v=0.2.2",
    "./src/ui.js": "./src/ui.js?v=0.2.2",
    "./src/textures.js": "./src/textures.js?v=0.2.2",
    "./src/post.js": "./src/post.js?v=0.2.2",
    "./src/layout.js": "./src/layout.js?v=0.2.2"
  }
  }</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="loading">Building the station…</div>

  <div id="readout">
    <button id="readout-toggle" title="Show or hide the numbers">Ring Station</button>
    <div id="readout-body"></div>
  </div>

  <div id="buttons">
    <button id="view">Outside view</button>
    <button id="toggle" title="Settings">Settings</button>
  </div>
  <div id="aim" title="Turn to face it as it is now (the ring keeps turning)">
    <span>Look at</span>
    <button data-target="moon">Moon</button>
    <button data-target="earth">Earth</button>
    <button data-target="sun">Sun</button>
  </div>

  <aside id="panel">
    <header><span>Design</span><button id="close" title="Close">×</button></header>
    <div id="panel-body"></div>
    <footer>
      <button id="copy">Copy link to this design</button>
      <button id="reset">Reset to defaults</button>
      <a id="home" href="../index.html">← All games</a>
    </footer>
  </aside>

  <div id="help">Left thumb or WASD to walk (Shift: 4× faster) · right thumb or drag to look</div>
  <div id="joy"><div id="knob"></div></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
